<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
<title id="title">Repo Fixer repository readiness workflow</title>
<desc id="desc">A clean dashboard illustration showing repository checks, a readiness score, and a reviewable change plan.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111c2e"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#0f766e"/></linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity=".16" stroke-width="1"/></pattern>
  <style>
    .float{animation:float 6s ease-in-out infinite}.beam{animation:beam 5s ease-in-out infinite}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    @keyframes beam{0%{transform:translateX(-180px);opacity:0}20%{opacity:.7}80%{opacity:.7}100%{transform:translateX(1120px);opacity:0}}
    @media (prefers-reduced-motion: reduce){.float,.beam{animation:none}.beam{display:none}}
  </style>
</defs>
<rect width="1280" height="420" rx="28" fill="url(#bg)"/><rect width="1280" height="420" rx="28" fill="url(#grid)"/>
<circle cx="1080" cy="70" r="145" fill="#60a5fa" opacity=".10"/><circle cx="120" cy="360" r="180" fill="#14b8a6" opacity=".08"/>
<g transform="translate(72 78)">
  <text x="0" y="20" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="4" fill="#2563eb">REPOSITORY READINESS</text>
  <text x="0" y="82" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#f8fafc">Know what needs work.</text>
  <text x="0" y="132" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#0f172a">Keep every change reviewable.</text>
  <text x="0" y="184" font-family="Arial,sans-serif" font-size="20" fill="#e2e8f0">Local audit  ·  Explainable score  ·  Safe file plans</text>
  <g transform="translate(0 222)">
    <rect width="174" height="42" rx="21" fill="#172d4a"/><circle cx="22" cy="21" r="6" fill="#2563eb"/><text x="38" y="27" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#bfdbfe">SCAN</text>
    <path d="M184 21h32m-8-7 8 7-8 7" fill="none" stroke="#64748b" stroke-width="2"/>
    <rect x="226" width="174" height="42" rx="21" fill="#123b39"/><circle cx="248" cy="21" r="6" fill="#0f766e"/><text x="264" y="27" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#99f6e4">SCORE</text>
    <path d="M410 21h32m-8-7 8 7-8 7" fill="none" stroke="#64748b" stroke-width="2"/>
    <rect x="452" width="214" height="42" rx="21" fill="#24254a"/><circle cx="474" cy="21" r="6" fill="#4f46e5"/><text x="490" y="27" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#c7d2fe">REVIEW PLAN</text>
  </g>
</g>
<g class="float" transform="translate(820 64)">
  <rect x="0" y="0" width="380" height="292" rx="20" fill="#172338" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="0" y="0" width="380" height="48" rx="20" fill="#1e293b"/><path d="M0 28v20h380V28" fill="#f1f5f9"/>
  <circle cx="24" cy="24" r="5" fill="#f87171"/><circle cx="44" cy="24" r="5" fill="#fbbf24"/><circle cx="64" cy="24" r="5" fill="#34d399"/>
  <text x="92" y="29" font-family="Arial,sans-serif" font-size="13" fill="#475569">repo-fixer · audit summary</text>
  <circle cx="102" cy="145" r="52" fill="none" stroke="#334155" stroke-width="12"/>
  <circle cx="102" cy="145" r="52" fill="none" stroke="url(#accent)" stroke-width="12" stroke-linecap="round" stroke-dasharray="245 327" transform="rotate(-90 102 145)"/>
  <text x="102" y="151" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#0f172a">A–F</text>
  <text x="184" y="105" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#64748b">CHECKLIST</text>
  <g font-family="Arial,sans-serif" font-size="14" fill="#334155">
    <circle cx="190" cy="133" r="6" fill="#10b981"/><text x="206" y="138">README</text>
    <circle cx="190" cy="163" r="6" fill="#10b981"/><text x="206" y="168">LICENSE</text>
    <circle cx="190" cy="193" r="6" fill="#f59e0b"/><text x="206" y="198">CI workflow</text>
    <circle cx="190" cy="223" r="6" fill="#10b981"/><text x="206" y="228">Contribution guide</text>
  </g>
  <rect x="24" y="258" width="332" height="10" rx="5" fill="#e2e8f0"/><rect class="beam" x="24" y="258" width="120" height="10" rx="5" fill="#3b82f6" opacity=".7"/>
</g>
</svg>