name: Release verification

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/release-verification.yml"
      - "scripts/verify_release_artifacts.py"
      - "tests/test_release_artifacts.py"
      - "pyproject.toml"
      - "MANIFEST*"
      - "requirements*.txt"
      - "repo_fixer/**"
      - "LICENSE"
      - "README.md"
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
        include:
          - os: windows-latest
            python-version: "3.14"
            experimental: true
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project requirements
        run: python -m pip install -r requirements.txt

      - name: Run release verifier (normal mode)
        run: |
          python -c "from pathlib import Path; Path('artifacts-normal').mkdir(exist_ok=True)"
          python scripts/verify_release_artifacts.py --artifacts-dir artifacts-normal

      - name: Build offline wheelhouse
        run: |
          python -m pip download --only-binary=:all: --dest wheelhouse "setuptools>=77.0.3" wheel -r requirements.txt

      - name: Run release verifier (offline mode)
        run: |
          python -c "from pathlib import Path; Path('artifacts-offline').mkdir(exist_ok=True)"
          python scripts/verify_release_artifacts.py --wheelhouse wheelhouse --no-index --artifacts-dir artifacts-offline

      - name: Upload normal-mode release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ runner.os }}-python-${{ matrix.python-version }}
          path: artifacts-normal/*
          if-no-files-found: error
