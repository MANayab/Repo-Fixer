name: Bug report
description: Report a reproducible problem with Repo Fixer.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Thanks for helping improve Repo Fixer. Do not include tokens, credentials, or private repository content."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the behavior and what you expected instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Repo Fixer version
      placeholder: 0.1.0
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide minimal, safe reproduction steps.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python version, operating system, and relevant details.
    validations:
      required: false
