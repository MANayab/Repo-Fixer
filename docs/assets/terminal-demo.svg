<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 610" role="img" aria-labelledby="title desc"><title id="title">Repo Fixer CLI demonstration</title><desc id="desc">Illustrative terminal showing scan, score, and dry-run commands with repository-dependent placeholder output.</desc><defs><style>text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.line{opacity:0;animation:reveal .35s ease-out forwards}.l1{animation-delay:.15s}.l2{animation-delay:.55s}.l3{animation-delay:.95s}.l4{animation-delay:1.35s}.l5{animation-delay:1.75s}.l6{animation-delay:2.15s}.l7{animation-delay:2.55s}.l8{animation-delay:2.95s}.l9{animation-delay:3.35s}.l10{animation-delay:3.75s}.l11{animation-delay:4.15s}.l12{animation-delay:4.55s}.l13{animation-delay:4.95s}.l14{animation-delay:5.35s}@keyframes reveal{to{opacity:1}}@media (prefers-reduced-motion: reduce){.line{animation:none;opacity:1}}</style></defs><rect width="1120" height="610" rx="24" fill="#0b1220" stroke="#334155" stroke-width="2"/><path d="M0 24Q0 0 24 0h1072q24 0 24 24v48H0z" fill="#172338"/><circle cx="32" cy="36" r="7" fill="#f87171"/><circle cx="58" cy="36" r="7" fill="#fbbf24"/><circle cx="84" cy="36" r="7" fill="#34d399"/><text x="560" y="42" text-anchor="middle" font-size="16" fill="#cbd5e1">Repo Fixer · terminal walkthrough</text><g font-size="17"><g class="line l1"><text x="42" y="112" fill="#5eead4">$ repo-fixer scan</text></g><g class="line l2"><text x="42" y="145" fill="#cbd5e1">Repository: &lt;repository-path&gt;</text></g><g class="line l3"><text x="42" y="178" fill="#cbd5e1">Readiness: &lt;score&gt;/100 (Grade &lt;grade&gt;)</text></g><g class="line l4"><text x="42" y="211" fill="#cbd5e1">Checks passed: &lt;passed&gt;/9</text></g><g class="line l5"><text x="42" y="244" fill="#94a3b8">Findings:</text></g><g class="line l6"><text x="66" y="277" fill="#fbbf24">- [SEVERITY] CHECK_ID — &lt;affected-file&gt;</text></g><g class="line l7"><text x="88" y="307" fill="#94a3b8">Evidence: &lt;evidence&gt;</text></g><g class="line l8"><text x="88" y="337" fill="#94a3b8">Recommendation: &lt;recommendation&gt;</text></g><g class="line l9"><text x="42" y="385" fill="#5eead4">$ repo-fixer score</text></g><g class="line l10"><text x="42" y="418" fill="#cbd5e1">Readiness score: &lt;score&gt;/100 (Grade &lt;grade&gt;)</text></g><g class="line l11"><text x="42" y="451" fill="#5eead4">$ repo-fixer fix --dry-run</text></g><g class="line l12"><text x="42" y="484" fill="#cbd5e1">Repo Fixer Fix Plan</text></g><g class="line l13"><text x="42" y="517" fill="#cbd5e1">Would create: &lt;planned-file&gt; (&lt;reason&gt;)</text></g><g class="line l14"><text x="42" y="550" fill="#34d399">Dry run: no files were modified.</text></g></g><text x="42" y="586" font-size="13" fill="#94a3b8">Illustrative output format · values and findings depend on the repository</text></svg>