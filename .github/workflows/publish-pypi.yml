name: Publish to PyPI

# Deliberately tag-only: pull requests and manual dispatches cannot publish.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: publish-pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Build and verify release artifacts
    runs-on: ubuntu-latest
    outputs:
      project_version: ${{ steps.version.outputs.project_version }}
      tag_version: ${{ steps.version.outputs.tag_version }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Require tag to match pyproject version
        id: version
        shell: bash
        run: |
          project_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [[ "${GITHUB_REF_NAME}" != v* ]]; then
            echo "Expected a version tag beginning with v." >&2
            exit 1
          fi
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$tag_version" != "$project_version" ]]; then
            echo "Tag version $tag_version does not match pyproject.toml version $project_version." >&2
            exit 1
          fi
          {
            echo "project_version=$project_version"
            echo "tag_version=$tag_version"
          } >> "$GITHUB_OUTPUT"

      # The verifier enforces the build-system requirement declared in pyproject.toml.
      - name: Build, validate, install, smoke-test, and checksum artifacts
        run: python scripts/verify_release_artifacts.py --artifacts-dir dist

      - name: Preserve verified artifacts and checksum sidecars
        uses: actions/upload-artifact@v4
        with:
          name: verified-release-artifacts
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish verified artifacts
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') && needs.verify.outputs.tag_version == needs.verify.outputs.project_version
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the verified artifacts
        uses: actions/download-artifact@v4
        with:
          name: verified-release-artifacts
          path: dist

      - name: Verify sidecars and select only package files
        shell: bash
        run: |
          cd dist
          sha256sum --check ./*.sha256
          mkdir ../packages
          cp ./*.whl ./*.tar.gz ../packages/
          test "$(find ../packages -maxdepth 1 -type f | wc -l)" -eq 2

      - name: Publish to PyPI using trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/
