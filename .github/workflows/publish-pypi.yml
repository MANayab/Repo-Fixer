name: Publish to PyPI

# Deliberately tag-only: pull requests and manual dispatches cannot publish.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: publish-pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Build and verify release artifacts
    runs-on: ubuntu-latest
    outputs:
      project_version: ${{ steps.version.outputs.project_version }}
      tag_version: ${{ steps.version.outputs.tag_version }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Require tag to match pyproject version
        id: version
        shell: bash
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          project_version = str(project["version"])

          def tag_matches(tag: str, version: str) -> bool:
              return tag.startswith("v") and tag[1:] == version

          # Regression proof for the approved 0.3.2 release:
          assert tag_matches("v0.3.2", "0.3.2")
          assert not tag_matches("v0.3.3", "0.3.2")

          tag = os.environ["GITHUB_REF_NAME"]
          if not tag_matches(tag, project_version):
              raise SystemExit(
                  f"Tag version {tag.removeprefix('v')} does not match "
                  f"pyproject.toml version {project_version}."
              )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"project_version={project_version}\n")
              output.write(f"tag_version={tag[1:]}\n")
          PY

      - name: Read the setuptools build requirement from pyproject.toml
        id: build-requirements
        shell: bash
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          requirements = tomllib.loads(
              Path("pyproject.toml").read_text(encoding="utf-8")
          )["build-system"]["requires"]
          setuptools = [
              requirement
              for requirement in requirements
              if requirement.lower().startswith("setuptools")
          ]
          if len(setuptools) != 1:
              raise SystemExit(
                  "Expected exactly one setuptools requirement in "
                  "pyproject.toml [build-system].requires"
              )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"setuptools_requirement={setuptools[0]}\n")
          PY

      - name: Prepare complete offline wheelhouse
        run: |
          python -m pip download --only-binary=:all: --dest wheelhouse "${{ steps.build-requirements.outputs.setuptools_requirement }}" wheel -r requirements.txt

      - name: Build, validate, install, smoke-test, and checksum artifacts
        run: python scripts/verify_release_artifacts.py --artifacts-dir dist --wheelhouse wheelhouse --no-index

      - name: Preserve verified artifacts and checksum sidecars
        uses: actions/upload-artifact@v4
        with:
          name: verified-release-artifacts
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish verified artifacts
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') && needs.verify.outputs.tag_version == needs.verify.outputs.project_version
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the verified artifacts
        uses: actions/download-artifact@v4
        with:
          name: verified-release-artifacts
          path: dist

      - name: Verify sidecars and select only package files
        shell: bash
        run: |
          cd dist
          sha256sum --check ./*.sha256
          mkdir ../packages
          cp ./*.whl ./*.tar.gz ../packages/
          test "$(find ../packages -maxdepth 1 -type f | wc -l)" -eq 2

      - name: Publish to PyPI using trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/
