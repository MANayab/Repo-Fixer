[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-fixer"
version = "0.3.1"
description = "Make any GitHub repository contributor-ready in minutes."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "MANayab" }]
classifiers = ["Development Status :: 3 - Alpha", "Environment :: Console", "Intended Audience :: Developers", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Topic :: Software Development :: Quality Assurance"]
dependencies = ["click>=8.1,<9", "pydantic>=2.7,<3", "PyYAML>=6,<7", "Jinja2>=3.1,<4"]

[project.scripts]
repo-fixer = "repo_fixer.cli:main"

[tool.setuptools.packages.find]
include = ["repo_fixer*"]

[tool.setuptools.package-data]
repo_fixer = ["templates/*.j2", "licenses/*"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["repo_fixer"]

[tool.coverage.report]
show_missing = true
precision = 2
fail_under = 90
